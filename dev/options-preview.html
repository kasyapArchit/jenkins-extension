<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jenkins Quickfire settings — preview</title>
  <link rel="stylesheet" href="../popup.css">
</head>
<body>
  <!-- The settings page in a browser tab, against the fake chrome the popup
       harness uses. Rather than copying options.html's markup, which is how the
       popup harness drifted from the worker once already, this lifts the real
       page's style and sheet out of the file itself, so it cannot go stale. -->
  <script src="mock-chrome.js"></script>
  <script type="module">
    // no-store, because a cached copy of options.html silently hides every edit
    // made since the page was last opened and looks exactly like a broken change.
    const html = await (await fetch('../options.html', { cache: 'no-store' })).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.head.append(...doc.head.querySelectorAll('style'));
    // options.html's own <link> hrefs are relative to the project root, not to
    // this page under dev/, so they are re-resolved against ../options.html
    // rather than copied as-is.
    for (const link of doc.head.querySelectorAll('link[rel="stylesheet"]')) {
      const clone = link.cloneNode();
      clone.href = new URL(link.getAttribute('href'), new URL('../options.html', location.href));
      document.head.append(clone);
    }
    document.body.append(doc.querySelector('.sheet'));
    await import('../options.js');
    // Same signal preview.html's shots.js sets, so a screenshot tool can wait
    // on one flag regardless of which preview page it's driving.
    document.documentElement.dataset.shotReady = '1';
  </script>
</body>
</html>
